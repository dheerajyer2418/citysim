plugins {
    id "java"
    id "application"
}

group = "citysim"
version = "0.1.0-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Repositories are declared in settings.gradle (dependencyResolutionManagement,
// FAIL_ON_PROJECT_REPOS), so none are declared here.

dependencies {
    // MATSim 2024.0 is the latest release built for Java 17 (2025.0+ require newer
    // JDKs). Pinned here so the local JDK 17 toolchain + Gradle 8.10.2 compile cleanly.
    implementation "org.matsim:matsim:2024.0"
    // cadytsIntegration is re-added at S4 (calibration); pt2matsim is unused
    // because the network/transit conversion is done in Python.
}

application {
    mainClass = "citysim.RunCitySim"
}

tasks.register("runCitySim", JavaExec) {
    group = "application"
    description = "Run the Logan Square MATSim scenario."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "citysim.RunCitySim"
}
